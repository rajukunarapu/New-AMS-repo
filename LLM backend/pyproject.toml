[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_backend"
version = "2.0.0"
description = "AI Backend Service for AMS"
readme = "SLA_SERVICE_README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "google-genai>=0.1.0",
    "google-generativeai>=0.8.0",
    "python-multipart>=0.0.9",
    "httpx>=0.25.0",
    "openai>=1.0.0"
]

[tool.setuptools]
include-package-data = true
py-modules = [
    "main",
    "ams_api",
    "config",
    "query_engine",
    "Module_Router",
    "run_scheduler",
    "ticket_filter"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = [
    "venv*",
    ".venv*",
    "__pycache__*",
    "*.pyc",
    "build*",
    "dist*"
]
namespaces = true


[tool.setuptools.package-data]
"*" = [
    "*",
    "*/*",
    "*/*/*",
    ".env",
    "*.db",
    "*.log",
    "*.txt",
    "*.md",
    "*.spec",
    "*.json",
    "*.py"
]



