<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Ring 1 gradient (Top) -->
    <linearGradient id="ringTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Ring 2 gradient (Bottom Right) -->
    <linearGradient id="ringRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Ring 3 gradient (Bottom Left) -->
    <linearGradient id="ringLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Center node gradient -->
    <radialGradient id="nodeGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#091424" />
    </radialGradient>
  </defs>

  <g transform="translate(60, 60)">
    <!-- 3 Intersecting Rings -->
    <!-- Top Ring -->
    <circle cx="0" cy="-20" r="28" fill="none" stroke="url(#ringTop)" stroke-width="8.5" stroke-linecap="round" opacity="0.95" />
    
    <!-- Bottom Left Ring -->
    <circle cx="-17.32" cy="10" r="28" fill="none" stroke="url(#ringLeft)" stroke-width="8.5" stroke-linecap="round" opacity="0.95" />

    <!-- Bottom Right Ring -->
    <circle cx="17.32" cy="10" r="28" fill="none" stroke="url(#ringRight)" stroke-width="8.5" stroke-linecap="round" opacity="0.95" />

    <!-- Inner connecting tri-spoke structure -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#091424" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-17.32" y2="10" stroke="#091424" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="17.32" y2="10" stroke="#091424" stroke-width="5" stroke-linecap="round" />

    <!-- Center Hub -->
    <circle cx="0" cy="0" r="6" fill="url(#nodeGrad)" />

    <!-- Outer Nodes -->
    <circle cx="0" cy="-20" r="5.5" fill="url(#nodeGrad)" />
    <circle cx="-17.32" cy="10" r="5.5" fill="url(#nodeGrad)" />
    <circle cx="17.32" cy="10" r="5.5" fill="url(#nodeGrad)" />
  </g>
</svg>
